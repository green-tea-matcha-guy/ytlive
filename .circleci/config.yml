version: 2.1

jobs:
  stream:
    docker:
      - image: cimg/python:3.12
    # frame rendering, drawing inference and x264 need more than one vCPU
    resource_class: medium
    environment:
      PENGPT_MODEL_DIR: /home/circleci/models
    steps:
      - checkout
      # everything slow to set up lives in one cache: ffmpeg, the Python environment and the model weights
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "requirements.txt" }}-{{ checksum "scripts/setup_ffmpeg.sh" }}
      - run:
          name: Set up ffmpeg, Python environment and models
          command: |
            scripts/setup_ffmpeg.sh
            [ -d ~/venv ] || python -m venv ~/venv
            if ! ~/venv/bin/python -c "import torch, transformers, PIL, pytest" 2>/dev/null; then
              ~/venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
              ~/venv/bin/pip install -r requirements.txt
            fi
            ~/venv/bin/python -c "import sketch; print(sketch.ensure_models())"
            echo 'export PATH=$HOME/ffmpeg/bin:$HOME/venv/bin:$PATH' >> "$BASH_ENV"
      - save_cache:
          key: deps-v1-{{ checksum "requirements.txt" }}-{{ checksum "scripts/setup_ffmpeg.sh" }}
          paths:
            - /home/circleci/ffmpeg
            - /home/circleci/venv
            - /home/circleci/models
      - run:
          name: Test
          command: python -m pytest -q tests
      - run:
          name: Stream
          command: |
            date +%s > /tmp/stream_start
            python app.py
          no_output_timeout: 30m
      - run:
          name: Start the next run
          when: always
          command: |
            # Chain runs so the stream continues past the job time limit.
            # Skip while RESTART_ENABLED=false (the kill switch for stopping the chain),
            # or while the placeholder IDs are still in place.
            if [ "$RESTART_ENABLED" = "false" ]; then
              echo "RESTART_ENABLED=false; not restarting"
              exit 0
            fi
            if [ "$YOUTUBE_STREAM_ID" = "REPLACE_ME" ] || [ "$YOUTUBE_BROADCAST_ID" = "REPLACE_ME" ]; then
              echo "Placeholder IDs; not restarting"
              exit 0
            fi
            # Back off if the run ended early (e.g. a crash) so failures cannot spin.
            if [ $(( $(date +%s) - $(cat /tmp/stream_start 2>/dev/null || echo 0) )) -lt 900 ]; then sleep 300; fi
            curl -sf -X POST \
              -H "Circle-Token: $CIRCLE_TOKEN" \
              -H "Content-Type: application/json" \
              "https://circleci.com/api/v2/project/$RESTART_PROJECT_SLUG/pipeline/run" \
              -d "{\"definition_id\":\"$RESTART_DEFINITION_ID\",\"config\":{\"branch\":\"main\"},\"checkout\":{\"branch\":\"main\"}}"

workflows:
  stream:
    jobs:
      - stream:
          # one encoder at a time: a new run waits for the previous one to end
          serial-group: << pipeline.project.slug >>/stream
